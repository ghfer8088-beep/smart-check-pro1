<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="30%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#B57C1E"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="40%" stop-color="#FF8F00"/>
      <stop offset="80%" stop-color="#C47D0B"/>
      <stop offset="100%" stop-color="#6D4304"/>
    </linearGradient>

    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="45%" stop-color="#FFD54F"/>
      <stop offset="75%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#8D5B05"/>
    </radialGradient>

    <radialGradient id="centerDial" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>

    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#1e40af"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="ribbonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#1e40af"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="ribbonTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drop Shadow Wrapper -->
  <g filter="url(#royalShadow)">
    
    <!-- Ribbon Tail Left -->
    <path d="M 185,320 L 140,465 L 185,435 L 230,465 L 210,320 Z" fill="url(#ribbonLeft)" stroke="url(#ribbonTrim)" stroke-width="2"/>
    <path d="M 180,320 L 180,438 L 190,438 L 190,320 Z" fill="url(#ribbonTrim)" opacity="0.85"/>

    <!-- Ribbon Tail Right -->
    <path d="M 315,320 L 290,465 L 335,435 L 380,465 L 335,320 Z" fill="url(#ribbonRight)" stroke="url(#ribbonTrim)" stroke-width="2"/>
    <path d="M 330,320 L 330,438 L 340,438 L 340,320 Z" fill="url(#ribbonTrim)" opacity="0.85"/>

    <!-- Outer Rosette Petals (32 Pleated Ribbons) -->
    <g transform="translate(250, 230)">
      <g><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(11.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(22.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(33.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(45)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(56.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(67.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(78.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(90)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(101.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(112.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(123.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(135)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(146.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(157.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(168.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(180)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(191.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(202.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(213.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(225)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(236.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(247.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(258.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(270)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(281.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(292.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(303.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(315)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(326.25)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(337.5)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
      <g transform="rotate(348.75)"><path d="M -15,-190 L 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldLight)"/><path d="M 0,-215 L 15,-190 L 0,-175 Z" fill="url(#goldDark)" opacity="0.6"/></g>
    </g>

    <!-- Outer Solid Golden Bezel -->
    <circle cx="250" cy="230" r="176" fill="url(#goldDark)"/>
    <circle cx="250" cy="230" r="172" fill="url(#goldLight)"/>

    <!-- Decorative Gold Pearl Ring -->
    <circle cx="250" cy="230" r="162" fill="none" stroke="url(#goldDark)" stroke-width="4" stroke-dasharray="2, 7" stroke-linecap="round"/>

    <!-- Inner Stepped Gold Rim -->
    <circle cx="250" cy="230" r="150" fill="url(#goldRadial)" stroke="#B57C1E" stroke-width="2"/>
    <circle cx="250" cy="230" r="144" fill="url(#centerDial)" stroke="url(#goldLight)" stroke-width="3"/>

    <!-- Fine Sunburst Rays Inside Medallion -->
    <g transform="translate(250, 230)" opacity="0.15">
      <line x1="0" y1="-140" x2="0" y2="140" stroke="#FFD54F" stroke-width="1.5"/>
      <line x1="-140" y1="0" x2="140" y2="0" stroke="#FFD54F" stroke-width="1.5"/>
      <line x1="-100" y1="-100" x2="100" y2="100" stroke="#FFD54F" stroke-width="1.5"/>
      <line x1="-100" y1="100" x2="100" y2="-100" stroke="#FFD54F" stroke-width="1.5"/>
      <line x1="-130" y1="-50" x2="130" y2="50" stroke="#FFD54F" stroke-width="1"/>
      <line x1="-130" y1="50" x2="130" y2="-50" stroke="#FFD54F" stroke-width="1"/>
      <line x1="-50" y1="-130" x2="50" y2="130" stroke="#FFD54F" stroke-width="1"/>
      <line x1="50" y1="-130" x2="-50" y2="130" stroke="#FFD54F" stroke-width="1"/>
    </g>

    <!-- Laurel Wreath of Victory & Excellence (Left & Right) -->
    <g transform="translate(250, 230)" fill="url(#goldLight)" stroke="#8D5B05" stroke-width="0.8">
      <!-- Leaf Clusters Left -->
      <ellipse cx="-45" cy="80" rx="14" ry="7" transform="rotate(-30, -45, 80)"/>
      <ellipse cx="-75" cy="55" rx="14" ry="7" transform="rotate(-15, -75, 55)"/>
      <ellipse cx="-95" cy="20" rx="14" ry="7" transform="rotate(5, -95, 20)"/>
      <ellipse cx="-100" cy="-20" rx="14" ry="7" transform="rotate(25, -100, -20)"/>
      <ellipse cx="-90" cy="-58" rx="13" ry="6.5" transform="rotate(45, -90, -58)"/>
      <ellipse cx="-68" cy="-90" rx="12" ry="6" transform="rotate(65, -68, -90)"/>
      <ellipse cx="-40" cy="-112" rx="11" ry="5.5" transform="rotate(85, -40, -112)"/>

      <!-- Leaf Clusters Right -->
      <ellipse cx="45" cy="80" rx="14" ry="7" transform="rotate(30, 45, 80)"/>
      <ellipse cx="75" cy="55" rx="14" ry="7" transform="rotate(15, 75, 55)"/>
      <ellipse cx="95" cy="20" rx="14" ry="7" transform="rotate(-5, 95, 20)"/>
      <ellipse cx="100" cy="-20" rx="14" ry="7" transform="rotate(-25, 100, -20)"/>
      <ellipse cx="90" cy="-58" rx="13" ry="6.5" transform="rotate(-45, 90, -58)"/>
      <ellipse cx="68" cy="-90" rx="12" ry="6" transform="rotate(-65, 68, -90)"/>
      <ellipse cx="40" cy="-112" rx="11" ry="5.5" transform="rotate(-85, 40, -112)"/>
      
      <!-- Laurel Bottom Tie Ribbon -->
      <circle cx="0" cy="98" r="7" fill="url(#goldLight)"/>
    </g>

    <!-- Central Royal 8-Pointed Star of Distinction -->
    <g transform="translate(250, 222)" filter="url(#goldGlow)">
      <!-- Main 4 Cardinal Points -->
      <path d="M 0,-72 L 13,-20 L 68,-12 L 24,18 L 38,70 L 0,38 L -38,70 L -24,18 L -68,-12 L -13,-20 Z" fill="url(#goldLight)" stroke="#C47D0B" stroke-width="1.5"/>
      <!-- Diagonal 4 Secondary Points -->
      <path d="M 0,-52 L 10,-15 L 50,-10 L 18,14 L 28,52 L 0,28 L -28,52 L -18,14 L -50,-10 L -10,-15 Z" fill="url(#goldDark)" transform="rotate(45)" opacity="0.85"/>
      
      <!-- Central Gem Core (Medical Diamond Emblem) -->
      <circle cx="0" cy="0" r="24" fill="url(#centerDial)" stroke="url(#goldLight)" stroke-width="2.5"/>
      <!-- Spine & Vertebrae Chiropractic Alignment Emblem -->
      <path d="M 0,-14 L 0,14 M -7,-9 L 7,-9 M -10,-3 L 10,-3 M -10,3 L 10,3 M -7,9 L 7,9" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#FFFDE7"/>
    </g>

    <!-- Arched Mini Star Accents -->
    <g transform="translate(250, 230)">
      <polygon points="0,-128 3,-120 11,-120 5,-115 7,-107 0,-111 -7,-107 -5,-115 -11,-120 -3,-120" fill="url(#goldLight)"/>
      <polygon points="-50,-122 -48,-117 -42,-117 -46,-113 -44,-108 -50,-111 -56,-108 -54,-113 -58,-117 -52,-117" fill="url(#goldLight)" opacity="0.8"/>
      <polygon points="50,-122 52,-117 58,-117 54,-113 56,-108 50,-111 44,-108 46,-113 42,-117 48,-117" fill="url(#goldLight)" opacity="0.8"/>
    </g>

  </g>
</svg>
