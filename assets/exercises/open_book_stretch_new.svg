<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <!-- Mat -->
  <rect x="40" y="155" width="240" height="10" rx="5" fill="#1e293b" stroke="#d4af37" stroke-width="1" opacity="0.7"/>
  <!-- Side-lying figure (Open Book - thoracic rotation) -->
  <!-- Body lying on side - hips stacked -->
  <!-- Lower legs/thighs (knees bent 90 deg, stacked) -->
  <path d="M100 152 Q130 150 165 150" stroke="url(#suit)" stroke-width="24" fill="none" stroke-linecap="round"/>
  <!-- Knees bent -->
  <path d="M165 150 Q175 145 180 135" stroke="url(#suit)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M165 152 Q175 158 180 165" stroke="url(#suit)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M100 148 Q90 138 80 125" stroke="url(#suit)" stroke-width="30" fill="none" stroke-linecap="round"/>
  <!-- Gold trim on suit -->
  <path d="M100 147 Q90 137 80 124" stroke="#d4af37" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Head -->
  <ellipse cx="70" cy="112" rx="19" ry="20" fill="#e8b89a"/>
  <ellipse cx="66" cy="95" rx="19" ry="11" fill="#2d1810"/>
  <!-- Bottom arm extended forward -->
  <path d="M85 135 Q75 140 55 142" stroke="url(#suit)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <ellipse cx="51" cy="143" rx="9" ry="5" fill="#e8b89a"/>
  <!-- TOP ARM - swinging open (the open book motion) - rotated back -->
  <path d="M85 128 Q110 115 140 100" stroke="url(#suit)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <ellipse cx="145" cy="97" rx="10" ry="7" fill="#e8b89a" transform="rotate(-30 145 97)"/>
  <!-- Chest opening arc arrow -->
  <path d="M95 118 Q115 105 140 95" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="137,88 146,93 138,100" fill="#d4af37"/>
  <!-- Return dashed arrow -->
  <path d="M55 138 Q65 128 80 118" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="5,3" stroke-linecap="round"/>
  <polygon points="77,112 87,116 80,124" fill="#38bdf8"/>
  <text x="150" y="85" font-family="Arial" font-size="8" fill="#d4af37">فتح</text>
  <text x="150" y="95" font-family="Arial" font-size="8" fill="#d4af37">الصدر</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">تمرين Open-Book للصدر</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Open-Book Thoracic Rotation</text>
</svg>
