<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <!-- Chair/bed surface -->
  <rect x="60" y="148" width="200" height="7" rx="3" fill="#1e293b" stroke="#d4af37" stroke-width="1"/>
  <!-- Seated figure (side view) -->
  <!-- Torso -->
  <rect x="88" y="95" width="50" height="55" rx="10" fill="url(#suit)"/>
  <line x1="88" y1="102" x2="138" y2="102" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="113" cy="77" rx="20" ry="22" fill="#e8b89a"/>
  <ellipse cx="113" cy="58" rx="20" ry="11" fill="#2d1810"/>
  <rect x="107" y="90" width="12" height="8" rx="4" fill="#e8b89a"/>
  <!-- Hands on thighs -->
  <path d="M88 118 Q78 130 75 148" stroke="url(#suit)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="74" cy="150" rx="9" ry="5" fill="#e8b89a"/>
  <!-- Thigh on surface -->
  <path d="M100 148 Q150 148 185 148" stroke="url(#suit)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Lower leg (hanging/extended) -->
  <path d="M185 148 Q195 148 210 148" stroke="url(#suit)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Foot - neutral -->
  <path d="M210 148 Q225 145 240 140" stroke="#e8b89a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Dorsiflexion position (foot pulled up) arrow -->
  <path d="M240 138 Q250 125 248 115" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="244,116 249,105 254,116" fill="#d4af37"/>
  <!-- Plantarflexion position (foot pushed down) arrow -->
  <path d="M240 142 Q250 155 248 165" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="5,3"/>
  <polygon points="244,164 249,175 254,164" fill="#38bdf8"/>
  <text x="258" y="112" font-family="Arial" font-size="8" fill="#d4af37">رفع</text>
  <text x="258" y="170" font-family="Arial" font-size="8" fill="#38bdf8">خفض</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">ثني وبسط الكاحل لتنشيط الدورة</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Ankle Dorsi/Plantarflexion</text>
</svg>
