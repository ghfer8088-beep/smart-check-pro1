<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <!-- Chair -->
  <rect x="100" y="155" width="120" height="6" rx="3" fill="#1e293b" stroke="#d4af37" stroke-width="1"/>
  <rect x="105" y="161" width="6" height="30" rx="2" fill="#1e293b"/>
  <rect x="209" y="161" width="6" height="30" rx="2" fill="#1e293b"/>
  <rect x="96" y="90" width="8" height="65" rx="3" fill="#1e293b" stroke="#d4af37" stroke-width="0.8"/>
  <!-- Seated figure with slumped back -->
  <!-- Pelvis/hips on chair -->
  <ellipse cx="160" cy="152" rx="30" ry="12" fill="url(#suit)"/>
  <!-- Torso slumped forward (C-shape) -->
  <path d="M148 152 Q140 130 148 108" stroke="url(#suit)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Back highlight -->
  <path d="M148 150 Q140 130 148 110" stroke="#0f172a" stroke-width="24" fill="none" stroke-linecap="round"/>
  <!-- Gold trim -->
  <path d="M143 148 Q135 128 143 110" stroke="#d4af37" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Head drooped forward -->
  <ellipse cx="152" cy="95" rx="18" ry="20" fill="#e8b89a" transform="rotate(-15 152 95)"/>
  <ellipse cx="150" cy="78" rx="18" ry="10" fill="#2d1810" transform="rotate(-15 150 78)"/>
  <!-- Extended leg (straight, nerve floss) -->
  <path d="M175 152 Q195 155 220 150" stroke="url(#suit)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Foot (dorsiflexed - pulled up) -->
  <ellipse cx="225" cy="148" rx="12" ry="7" fill="#e8b89a" transform="rotate(-20 225 148)"/>
  <!-- Arms on chair arms -->
  <path d="M148 130 Q130 138 115 150" stroke="url(#suit)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="112" cy="152" rx="7" ry="5" fill="#e8b89a"/>
  <!-- Bent leg down -->
  <path d="M145 155 Q145 170 148 185" stroke="url(#suit)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <ellipse cx="148" cy="187" rx="11" ry="5" fill="#1e293b"/>
  <!-- Nerve path line (the sciatic nerve path) -->
  <path d="M160 130 Q175 145 215 148" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="6,3" opacity="0.7"/>
  <!-- Ankle flex arrow -->
  <path d="M230 155 Q242 148 238 138" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="234,139 242,133 240,144" fill="#d4af37"/>
  <!-- Back slump arrow -->
  <path d="M125 108 Q110 128 118 150" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="120,150 112,158 125,155" fill="#38bdf8"/>
  <!-- Labels -->
  <text x="255" y="143" font-family="Arial" font-size="8" fill="#d4af37">مد</text>
  <text x="255" y="153" font-family="Arial" font-size="8" fill="#d4af37">الكاحل</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">تحرير المسار العصبي (Slump)</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Slump Nerve Floss</text>
</svg>
