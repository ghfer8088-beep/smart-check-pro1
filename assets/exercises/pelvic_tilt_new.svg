<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <!-- Mat -->
  <rect x="40" y="158" width="240" height="10" rx="5" fill="#1e293b" stroke="#d4af37" stroke-width="1" opacity="0.8"/>
  <!-- Lying figure - supine (on back), knees bent -->
  <!-- Head -->
  <ellipse cx="75" cy="145" rx="20" ry="18" fill="#e8b89a"/>
  <ellipse cx="75" cy="130" rx="20" ry="10" fill="#2d1810"/>
  <!-- Torso on mat -->
  <path d="M90 148 Q130 150 170 150" stroke="url(#suit)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M90 148 Q130 150 170 150" stroke="#0f172a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M90 148 Q130 150 170 150" stroke="#d4af37" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Hips/pelvis area -->
  <ellipse cx="175" cy="150" rx="20" ry="14" fill="url(#suit)"/>
  <!-- Thighs (knees bent) -->
  <path d="M175 148 Q190 145 200 155" stroke="url(#suit)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M175 152 Q190 155 200 160" stroke="url(#suit)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Lower legs / feet flat -->
  <path d="M200 155 Q210 158 225 158" stroke="url(#suit)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M200 160 Q210 162 225 162" stroke="url(#suit)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Arms at sides -->
  <path d="M100 153 Q100 162 100 165" stroke="url(#suit)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M155 153 Q155 162 155 165" stroke="url(#suit)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Pelvis tilt arc arrow - flatten lower back -->
  <path d="M160 142 Q170 128 185 136" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="181,130 189,132 184,141" fill="#d4af37"/>
  <!-- Lower back gap indicator -->
  <path d="M120 155 Q135 162 150 155" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <text x="195" y="128" font-family="Arial" font-size="8" fill="#d4af37">إمالة</text>
  <text x="195" y="138" font-family="Arial" font-size="8" fill="#d4af37">الحوض</text>
  <text x="130" y="175" font-family="Arial" font-size="7.5" fill="#38bdf8" text-anchor="middle">تسطيح أسفل الظهر</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">إمالة الحوض (Pelvic Tilt)</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Pelvic Tilt - Lumbar Stabilization</text>
</svg>
