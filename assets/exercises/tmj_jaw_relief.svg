<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Head Profile & Jaw -->
  <path d="M 230 110 C 230 60 310 60 310 120 C 310 150 295 170 295 190 C 295 215 265 240 230 240 C 210 240 195 225 195 200 L 195 160 C 195 135 210 110 230 110 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/>
  
  <!-- Neck -->
  <path d="M 210 235 L 210 320" stroke="#fed7aa" stroke-width="28" stroke-linecap="round"/>
  <path d="M 265 235 L 285 320" stroke="#fed7aa" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Ear -->
  <path d="M 205 155 C 190 155 190 185 205 185" fill="#fdba74" stroke="#ea580c" stroke-width="3"/>
  
  <!-- TMJ Joint circle indicator -->
  <circle cx="215" cy="165" r="14" fill="#ef4444" opacity="0.85" stroke="#991b1b" stroke-width="3"/>
  
  <!-- Thumb under chin (Resistance / Isometric) -->
  <path d="M 235 245 L 235 295" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
  <!-- Hand fist below -->
  <rect x="215" y="295" width="45" height="50" rx="10" fill="#ea580c"/>
  
  <!-- Upward resistance arrow -->
  <path d="M 238 275 L 238 245" stroke="#0284c7" stroke-width="5" marker-end="url(#arrowUp)"/>
  
  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 6 L 5 0 L 10 6 z" fill="#0284c7" />
    </marker>
  </defs>
  
  <!-- Text Label -->
  <rect x="90" y="355" width="320" height="34" rx="8" fill="#0f172a"/>
  <text x="250" y="377" fill="#fcd34d" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">تمرين مقاومة واسترخاء الفك الصدغي (TMJ)</text>
</svg>
