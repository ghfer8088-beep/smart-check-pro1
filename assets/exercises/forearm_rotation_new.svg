<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <rect x="60" y="178" width="200" height="3" rx="1.5" fill="rgba(212,175,55,0.2)"/>
  <!-- Standing figure torso -->
  <rect x="148" y="98" width="38" height="55" rx="8" fill="url(#suit)"/>
  <line x1="148" y1="105" x2="186" y2="105" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <rect x="154" y="148" width="12" height="30" rx="5" fill="url(#suit)"/>
  <rect x="170" y="148" width="12" height="30" rx="5" fill="url(#suit)"/>
  <ellipse cx="160" cy="179" rx="10" ry="4" fill="#1e293b"/>
  <ellipse cx="176" cy="179" rx="10" ry="4" fill="#1e293b"/>
  <ellipse cx="167" cy="80" rx="19" ry="21" fill="#e8b89a"/>
  <ellipse cx="167" cy="62" rx="19" ry="11" fill="#2d1810"/>
  <ellipse cx="162" cy="77" rx="2" ry="2.5" fill="#333"/>
  <ellipse cx="172" cy="77" rx="2" ry="2.5" fill="#333"/>
  <rect x="161" y="91" width="12" height="10" rx="5" fill="#e8b89a"/>
  <!-- Right arm bent at 90° holding a pen/cylinder -->
  <path d="M186 108 L186 140" stroke="url(#suit)" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- Forearm horizontal -->
  <path d="M186 140 L232 140" stroke="url(#suit)" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- Hand/wrist -->
  <ellipse cx="238" cy="140" rx="13" ry="8" fill="#e8b89a"/>
  <!-- Cylinder/pen being rotated -->
  <rect x="232" y="133" width="6" height="30" rx="3" fill="#d4af37" opacity="0.8"/>
  <!-- Rotation arrows around the forearm axis -->
  <path d="M215 128 Q225 120 235 128" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="231,123 239,125 232,132" fill="#d4af37"/>
  <path d="M215 152 Q225 160 235 152" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="5,3"/>
  <polygon points="231,157 239,155 232,148" fill="#38bdf8"/>
  <!-- Labels -->
  <text x="255" y="126" font-family="Arial" font-size="8" fill="#d4af37">تكفير</text>
  <text x="255" y="155" font-family="Arial" font-size="8" fill="#38bdf8">تكعير</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">تدوير الساعد (Pronation &amp; Supination)</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Forearm Rotation Exercise</text>
</svg>
