<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <!-- Table -->
  <rect x="50" y="95" width="130" height="8" rx="3" fill="#1e293b" stroke="#d4af37" stroke-width="1"/>
  <rect x="55" y="103" width="8" height="70" rx="2" fill="#1e293b"/>
  <rect x="167" y="103" width="8" height="70" rx="2" fill="#1e293b"/>
  <!-- Figure leaning on table (bent forward ~90deg) -->
  <!-- Torso horizontal -->
  <path d="M100 100 Q120 96 148 94" stroke="url(#suit)" stroke-width="30" fill="none" stroke-linecap="round"/>
  <!-- Back -->
  <path d="M100 99 Q120 95 148 93" stroke="#0f172a" stroke-width="26" fill="none" stroke-linecap="round"/>
  <!-- Head down -->
  <ellipse cx="90" cy="88" rx="18" ry="20" fill="#e8b89a"/>
  <ellipse cx="88" cy="70" rx="18" ry="10" fill="#2d1810"/>
  <!-- Supporting arm on table -->
  <path d="M120 96 Q115 96 110 96" stroke="url(#suit)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <ellipse cx="107" cy="96" rx="8" ry="5" fill="#e8b89a"/>
  <!-- Legs going down from torso bend -->
  <path d="M148 94 Q155 100 156 130 Q157 160 158 175" stroke="url(#suit)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <ellipse cx="155" cy="178" rx="14" ry="5" fill="#1e293b"/>
  <!-- Hanging arm (the pendulum arm) -->
  <path d="M100 100 Q108 110 112 130 Q116 150 118 165" stroke="url(#suit)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <ellipse cx="118" cy="167" rx="9" ry="6" fill="#e8b89a"/>
  <!-- Circular pendulum motion arrows -->
  <circle cx="175" cy="155" r="30" stroke="#d4af37" stroke-width="2.5" fill="none" opacity="0.25"/>
  <path d="M148 148 A30 30 0 1 1 203 148" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-dasharray="0"/>
  <polygon points="200,148 208,142 208,155" fill="#d4af37"/>
  <!-- Inner gravity arrow (downward) -->
  <line x1="175" y1="125" x2="175" y2="145" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="170,143 175,153 180,143" fill="#38bdf8"/>
  <text x="212" y="158" font-family="Arial" font-size="8" fill="#d4af37">دوران</text>
  <text x="212" y="168" font-family="Arial" font-size="8" fill="#d4af37">حر</text>
  <text x="175" y="108" font-family="Arial" font-size="8" fill="#38bdf8" text-anchor="middle">جاذبية</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">بندول كودمان (Codman)</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Codman Pendulum Exercise</text>
</svg>
