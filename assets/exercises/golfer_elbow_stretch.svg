<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <rect x="60" y="178" width="200" height="3" rx="1.5" fill="rgba(212,175,55,0.2)"/>
  <!-- Standing figure -->
  <rect x="148" y="100" width="38" height="55" rx="8" fill="url(#suit)"/>
  <line x1="148" y1="107" x2="186" y2="107" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <rect x="154" y="150" width="12" height="28" rx="5" fill="url(#suit)"/>
  <rect x="170" y="150" width="12" height="28" rx="5" fill="url(#suit)"/>
  <ellipse cx="160" cy="179" rx="10" ry="4" fill="#1e293b"/>
  <ellipse cx="176" cy="179" rx="10" ry="4" fill="#1e293b"/>
  <ellipse cx="167" cy="82" rx="19" ry="21" fill="#e8b89a"/>
  <ellipse cx="167" cy="64" rx="19" ry="11" fill="#2d1810"/>
  <ellipse cx="162" cy="79" rx="2" ry="2.5" fill="#333"/>
  <ellipse cx="172" cy="79" rx="2" ry="2.5" fill="#333"/>
  <rect x="161" y="93" width="12" height="10" rx="5" fill="#e8b89a"/>
  <!-- Outstretched arm palm UP, wrist extended UPWARD (golfer stretch) -->
  <path d="M186 112 Q215 110 240 108" stroke="url(#suit)" stroke-width="13" fill="none" stroke-linecap="round"/>
  <ellipse cx="244" cy="106" rx="14" ry="8" fill="#e8b89a" transform="rotate(-10 244 106)"/>
  <!-- Fingers pointing UP -->
  <path d="M238 100 Q240 90 245 86 Q250 90 252 98" stroke="#e8b89a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Other hand pressing fingers back (upward) -->
  <path d="M148 115 Q120 112 105 108" stroke="url(#suit)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <ellipse cx="100" cy="106" rx="12" ry="7" fill="#e8b89a"/>
  <!-- Pressure arrow upward -->
  <path d="M248 118 L248 104" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
  <polygon points="243,105 248,95 253,105" fill="#d4af37"/>
  <!-- Stretch arc -->
  <path d="M230 108 Q237 98 244 94" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <text x="265" y="102" font-family="Arial" font-size="8" fill="#d4af37">ضغط</text>
  <text x="265" y="112" font-family="Arial" font-size="8" fill="#d4af37">للأعلى</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">إطالة أوتار الكوع الداخلية</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Golfer Elbow Stretch</text>
</svg>
