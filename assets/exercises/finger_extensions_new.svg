<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <rect x="60" y="178" width="200" height="3" rx="1.5" fill="rgba(212,175,55,0.2)"/>
  <rect x="148" y="98" width="38" height="55" rx="8" fill="url(#suit)"/>
  <line x1="148" y1="105" x2="186" y2="105" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <rect x="154" y="148" width="12" height="30" rx="5" fill="url(#suit)"/>
  <rect x="170" y="148" width="12" height="30" rx="5" fill="url(#suit)"/>
  <ellipse cx="160" cy="179" rx="10" ry="4" fill="#1e293b"/>
  <ellipse cx="176" cy="179" rx="10" ry="4" fill="#1e293b"/>
  <ellipse cx="167" cy="80" rx="19" ry="21" fill="#e8b89a"/>
  <ellipse cx="167" cy="62" rx="19" ry="11" fill="#2d1810"/>
  <rect x="161" y="91" width="12" height="10" rx="5" fill="#e8b89a"/>
  <!-- Two hands in front showing finger spread -->
  <!-- Left hand - fingers closed/fist -->
  <ellipse cx="105" cy="130" rx="20" ry="16" fill="#e8b89a"/>
  <rect x="88" y="115" width="8" height="20" rx="4" fill="#e8b89a"/>
  <rect x="98" y="113" width="8" height="20" rx="4" fill="#e8b89a"/>
  <rect x="108" y="113" width="8" height="18" rx="4" fill="#e8b89a"/>
  <rect x="117" y="115" width="7" height="17" rx="3.5" fill="#e8b89a"/>
  <!-- Arrow from left (closed) to right (open) -->
  <path d="M132 122 L158 122" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-dasharray="5,3"/>
  <polygon points="155,117 165,122 155,127" fill="#d4af37"/>
  <!-- Right hand - fingers spread wide OPEN -->
  <ellipse cx="200" cy="130" rx="22" ry="16" fill="#e8b89a"/>
  <rect x="178" y="108" width="7" height="25" rx="3.5" fill="#e8b89a" transform="rotate(-15 178 108)"/>
  <rect x="188" y="105" width="7" height="26" rx="3.5" fill="#e8b89a" transform="rotate(-5 188 105)"/>
  <rect x="199" y="104" width="7" height="27" rx="3.5" fill="#e8b89a"/>
  <rect x="210" y="106" width="7" height="25" rx="3.5" fill="#e8b89a" transform="rotate(8 210 106)"/>
  <rect x="219" y="112" width="6" height="22" rx="3" fill="#e8b89a" transform="rotate(20 219 112)"/>
  <!-- Spread arrows on open hand -->
  <line x1="179" y1="105" x2="171" y2="97" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <polygon points="168,96 169,88 176,94" fill="#38bdf8"/>
  <line x1="222" y1="108" x2="230" y2="100" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <polygon points="227,97 235,95 230,105" fill="#38bdf8"/>
  <!-- Arms -->
  <path d="M148 118 Q132 122 120 128" stroke="url(#suit)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M186 118 Q210 122 218 128" stroke="url(#suit)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">تمديد وبسط الأصابع وتفريغ الاحتقان</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Finger Extension &amp; Decompression</text>
</svg>
