<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090e17"/>
      <stop offset="100%" style="stop-color:#131d2e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b89a"/>
      <stop offset="100%" style="stop-color:#c8906a"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <rect x="60" y="175" width="200" height="3" rx="1.5" fill="rgba(212,175,55,0.2)"/>
  <!-- Body torso -->
  <rect x="137" y="108" width="46" height="55" rx="8" fill="url(#suit)"/>
  <line x1="137" y1="115" x2="183" y2="115" stroke="#d4af37" stroke-width="1.2" opacity="0.6"/>
  <!-- Legs -->
  <rect x="141" y="158" width="14" height="18" rx="5" fill="url(#suit)"/>
  <rect x="162" y="158" width="14" height="18" rx="5" fill="url(#suit)"/>
  <ellipse cx="148" cy="176" rx="10" ry="4" fill="#1e293b"/>
  <ellipse cx="169" cy="176" rx="10" ry="4" fill="#1e293b"/>
  <!-- Arms -->
  <rect x="121" y="110" width="13" height="38" rx="6" fill="url(#suit)"/>
  <rect x="186" y="110" width="13" height="38" rx="6" fill="url(#suit)"/>
  <ellipse cx="127" cy="150" rx="7" ry="5" fill="#e8b89a"/>
  <ellipse cx="193" cy="150" rx="7" ry="5" fill="#e8b89a"/>
  <!-- Neck tilted -->
  <ellipse cx="163" cy="98" rx="9" ry="12" fill="#e8b89a" transform="rotate(18 163 98)"/>
  <!-- Head tilted right -->
  <ellipse cx="168" cy="75" rx="22" ry="26" fill="#e8b89a" transform="rotate(20 168 75)"/>
  <ellipse cx="168" cy="55" rx="22" ry="12" fill="#2d1810" transform="rotate(20 168 55)"/>
  <ellipse cx="164" cy="70" rx="2" ry="2.5" fill="#333"/>
  <ellipse cx="175" cy="71" rx="2" ry="2.5" fill="#333"/>
  <path d="M165 80 Q170 84 176 80" stroke="#8b4513" stroke-width="1.2" fill="none"/>
  <!-- Hand on head -->
  <line x1="127" y1="145" x2="152" y2="65" stroke="#e8b89a" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="152" cy="62" rx="8" ry="6" fill="#e8b89a"/>
  <!-- Motion arrows -->
  <path d="M195 60 Q215 75 210 100" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="205,100 215,105 213,93" fill="#d4af37"/>
  <path d="M195 115 Q218 100 212 70" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="5,4" stroke-linecap="round"/>
  <polygon points="208,68 218,65 212,76" fill="#38bdf8"/>
  <text x="226" y="90" font-family="Arial,sans-serif" font-size="9" fill="#d4af37" text-anchor="middle">جانب</text>
  <text x="226" y="101" font-family="Arial,sans-serif" font-size="9" fill="#d4af37" text-anchor="middle">أيمن</text>
  <text x="160" y="200" font-family="Arial,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">إطالة الرقبة الجانبية</text>
  <text x="160" y="212" font-family="Arial,sans-serif" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Lateral Neck Stretch</text>
</svg>
