<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" width="320" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#090e17"/><stop offset="100%" style="stop-color:#131d2e"/></linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e8b89a"/><stop offset="100%" style="stop-color:#c8906a"/></linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
  </defs>
  <rect width="320" height="215" fill="url(#bg)"/>
  <!-- Chair -->
  <rect x="90" y="150" width="140" height="6" rx="3" fill="#1e293b" stroke="#d4af37" stroke-width="1"/>
  <rect x="95" y="156" width="6" height="25" rx="2" fill="#1e293b"/>
  <rect x="219" y="156" width="6" height="25" rx="2" fill="#1e293b"/>
  <!-- Seated figure -->
  <ellipse cx="160" cy="147" rx="28" ry="11" fill="url(#suit)"/>
  <rect x="135" y="100" width="50" height="50" rx="10" fill="url(#suit)"/>
  <line x1="135" y1="107" x2="185" y2="107" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <rect x="140" y="148" width="12" height="28" rx="5" fill="url(#suit)"/>
  <rect x="168" y="148" width="12" height="28" rx="5" fill="url(#suit)"/>
  <ellipse cx="160" cy="82" rx="19" ry="22" fill="#e8b89a"/>
  <ellipse cx="160" cy="63" rx="19" ry="11" fill="#2d1810"/>
  <rect x="154" y="94" width="12" height="9" rx="4.5" fill="#e8b89a"/>
  <!-- Forearms resting on thighs, wrists at edge -->
  <path d="M135 120 Q120 130 108 145" stroke="url(#suit)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M185 120 Q200 130 212 145" stroke="url(#suit)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Hands with light weight/dumbbell -->
  <ellipse cx="108" cy="148" rx="12" ry="7" fill="#e8b89a"/>
  <ellipse cx="212" cy="148" rx="12" ry="7" fill="#e8b89a"/>
  <!-- Mini dumbbell -->
  <rect x="96" y="144" width="5" height="9" rx="2" fill="#d4af37" opacity="0.8"/>
  <rect x="107" y="142" width="3" height="13" rx="1.5" fill="#d4af37" opacity="0.5"/>
  <rect x="112" y="144" width="5" height="9" rx="2" fill="#d4af37" opacity="0.8"/>
  <!-- Wrist curl up arrow -->
  <path d="M108 143 Q108 130 115 122" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="111,122 118,115 119,126" fill="#d4af37"/>
  <!-- Wrist lower dashed arrow -->
  <path d="M108 152 Q108 163 100 168" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,3" stroke-linecap="round"/>
  <polygon points="97,165 96,174 104,168" fill="#38bdf8"/>
  <text x="75" y="130" font-family="Arial" font-size="8" fill="#d4af37">رفع</text>
  <text x="75" y="160" font-family="Arial" font-size="8" fill="#38bdf8">خفض</text>
  <text x="160" y="200" font-family="Arial" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">ثني وتدوير الرسغ لتقوية الأوتار</text>
  <text x="160" y="212" font-family="Arial" font-size="9" fill="rgba(212,175,55,0.7)" text-anchor="middle">Wrist Curls - Tendon Strengthening</text>
</svg>
